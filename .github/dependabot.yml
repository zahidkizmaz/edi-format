version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    allow:
      - dependency-type: "all"
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 14
    # release.yml is auto-generated by cargo-dist
    exclude-paths:
      - ".github/workflows/release.yml"
